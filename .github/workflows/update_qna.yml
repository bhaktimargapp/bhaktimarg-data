name: Auto-Update Premanand Ji QnA Index

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: python3 -m pip install -U yt-dlp

      - name: Run Vartalaap Timestamp Scraper
        run: python3 scrape_vartalaap.py

      - name: Commit & Push Updated JSON
        run: |
          git config user.name "BhaktiMarg Auto-Indexer"
          git config user.email "bot@bhaktimarg.app"
          git add premanand_qna.json
          git diff --staged --quiet || git commit -m "Auto-update Ekantik Vartalaap QnA index"
          git push
