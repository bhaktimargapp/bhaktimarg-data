name: Broadcast Daily Darshan (Fallback)

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification Title'
        required: true
        default: 'Daily Darshan 🌸'
      body:
        description: 'Notification Body'
        required: true
        default: 'Today''s divine Darshan is now available. Tap to view.'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
          token_format: 'access_token'

      - name: Send FCM v1 Push Notification
        run: |
          VERSION_SHA="${{ github.sha }}"
          PROJECT_ID="bhakti-marg-app-fb"
          TITLE="${{ github.event.inputs.title }}"
          BODY="${{ github.event.inputs.body }}"
          
          curl -X POST "https://fcm.googleapis.com/v1/projects/$PROJECT_ID/messages:send" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "message": {
                "topic": "all_users",
                "notification": {
                  "title": "'"$TITLE"'",
                  "body": "'"$BODY"'"
                },
                "data": {
                  "new_darshan_version": "'$VERSION_SHA'",
                  "route": "darshan_full"
                },
                "android": {
                  "priority": "HIGH"
                }
              }
            }'
